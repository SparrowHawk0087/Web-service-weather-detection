default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  username: <%= ENV.fetch("DB_USER") { raise "DB_USER must be set in the environment" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { raise "DB_PASSWORD must be set in the environment" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "web_service_weather_detection_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "web_service_weather_detection_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "web_service_weather_detection_production") %>
