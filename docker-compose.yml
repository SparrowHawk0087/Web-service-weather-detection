services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-weather}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-web_service_weather_detection_development}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
    environment:
      MOCK_SCENARIO: ${MOCK_SCENARIO:-random}
      MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-1}
      MOCK_FAIL_FIRST_N_REQUESTS: ${MOCK_FAIL_FIRST_N_REQUESTS:-0}
    ports:
      - "8000:8000"

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_USER: ${DB_USER:-weather}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-web_service_weather_detection_development}
      DB_NAME_TEST: ${DB_NAME_TEST:-web_service_weather_detection_test}
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:8000/predict
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - prediction_uploads:/app/storage/prediction_uploads
    command: >
      bash -lc "rm -f tmp/pids/server.pid &&
      bin/rails db:prepare &&
      bin/rails db:seed &&
      bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started

  sidekiq:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_USER: ${DB_USER:-weather}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-web_service_weather_detection_development}
      DB_NAME_TEST: ${DB_NAME_TEST:-web_service_weather_detection_test}
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:8000/predict
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - prediction_uploads:/app/storage/prediction_uploads
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend-js
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend-api

volumes:
  pgdata:
  redisdata:
  prediction_uploads:
