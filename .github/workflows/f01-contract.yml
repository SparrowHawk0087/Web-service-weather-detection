name: F-01 Contract Checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-js
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run domain and API tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend RSpec
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_USER: weather
      DB_PASSWORD: weather_test_password
      DB_NAME: weather_detection_ci
      DB_NAME_TEST: weather_detection_test_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      ML_SERVICE_URL: http://127.0.0.1:8000/predict
      SECRET_KEY_BASE: f01-ci-secret-key-base-not-for-production
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather_test_password
          POSTGRES_DB: weather_detection_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather -d weather_detection_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: backend-api

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Run RSpec
        run: bundle exec rspec

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application services
        run: docker compose build backend-api sidekiq dispatch-recovery db-setup frontend ml-service
