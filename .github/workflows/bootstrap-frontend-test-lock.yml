name: Bootstrap frontend test lockfile

on:
  push:
    branches:
      - "feat/poro-serialization"
    paths:
      - "frontend-js/package.json"

permissions:
  contents: write
  actions: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate the npm lockfile
        working-directory: frontend-js
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Commit the generated lockfile
        id: commit-lock
        shell: bash
        run: |
          if git diff --quiet -- frontend-js/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-js/package-lock.json
          git commit -m "build(deps): lock frontend test tooling"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch the full F-01 checks against the updated branch
        if: steps.commit-lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/f01-contract.yml/dispatches"
